[build]
  publish = "."
  functions = "netlify/functions"

# /suno/* is served by netlify/functions/suno-proxy.mjs (same-origin, no CORS issues).
# File uploads are proxied straight through to the SunoAPI upload host.
[[redirects]]
  from = "/suno-upload/*"
  to = "https://sunoapiorg.redpandaai.co/:splat"
  status = 200
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"
